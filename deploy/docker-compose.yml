name: my-assistant

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-assistant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      APP_MODE: ${APP_MODE:-server}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant_dev_password}@postgres:5432/${POSTGRES_DB:-assistant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required (master key for secret encryption)}
      DATA_DIR: /data
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      # Builtin web_search → SearXNG (json API enabled in ./searxng/settings.yml).
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Object storage for attachments + artifacts (local dir or S3).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/files}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ALLOW_HTTP: ${S3_ALLOW_HTTP:-}
    volumes:
      - appdata:/data
    ports:
      - "${APP_PORT:-3000}:3000"

  # Web search backend for the builtin `web_search` tool.
  # `make docker-searxng` starts it alone for local dev (:8080).
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change_me_searxng_secret}
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional local S3 (MinIO) — `docker compose --profile minio up`.
  # Then set STORAGE_BACKEND=s3, S3_ENDPOINT=http://minio:9000,
  # S3_BUCKET=assistant, S3_ALLOW_HTTP=true (+ keys) on the app service.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
  appdata:
  miniodata:
